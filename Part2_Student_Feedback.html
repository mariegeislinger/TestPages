<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello Forms</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link href="feedback-styles.css" type="text/css" rel="stylesheet">

</head>


<body>

    <div class="bg-dark-subtle m-4 p-3 rounded-5 text-center">
        <h1>Student Feedback Submission</h1>
    </div >


<div class="row">

    <div class="col-md-5">
            <h2 class="header bg-secondary-sutle p-3 mb-5">Instruction </h2>
            <p>Please provide your feedback.</p>
            <p>Your feedback is very important.</p>
    </div>


<div class="col-md-7">
        <form>
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" type="text" name="name"> <br>

            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" name="email"> <br>

            <label class="form-label" for="comments">Comments</label>
            <textarea class="form-control" id="comments" type="text" name="comments" required>Enter feedback.</textarea> <br>

            
            <p class="mx-2">Are you a student?</p>
            
                <div class="form-check">
                        <input class="form-check-input" id="yes" type="radio" name="current-student"> 
                        <label class="form-check-label" for="yes">Yes</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" id="no" type="radio" name="current-student"> 
                    <label class="form-check-label" for="yes">No</label> <br>
                </div>
        
            <input class="btn btn-primary" type="SUBMIT">

        </form>
</div>
</div>

</body>
</html>
